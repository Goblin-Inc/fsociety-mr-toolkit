# Mr. Robot Palette Definition
set $bg_dark      #080808
set $bg_surface   #121212
set $fg_main      #D6D6D6
set $fg_muted     #666666
set $accent       #B00000
set $accent_bright #E00000
set $border_dark  #222222

# Window Colors
# class                 border        backgr.       text        indicator     child_border
client.focused          $accent       $bg_surface   $fg_main    $accent_bright $accent
client.focused_inactive $border_dark  $bg_dark      $fg_muted   $border_dark  $border_dark
client.unfocused        $border_dark  $bg_dark      $fg_muted   $border_dark  $border_dark
client.urgent           $accent_bright $accent_bright $fg_main  $accent_bright $accent_bright
client.placeholder      $bg_dark      $bg_dark      $fg_main    $bg_dark      $bg_dark

client.background       $bg_dark
