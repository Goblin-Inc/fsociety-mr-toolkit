font pango:JetBrains Mono Bold 9

# Убираем стандартные рамки окон
default_border pixel 2
default_floating_border pixel 2

# Отключаем заголовки окон для минимализма
for_window [class="^.*"] border pixel 2

# Appearance & Theme Integration
include ~/.config/i3/themes/mrrobot.conf

font pango:JetBrains Mono 9

default_border pixel 2
default_floating_border pixel 2

for_window [class="^.*"] border pixel 2

# Правила окна для микшера
for_window [class="mr_mixer_float"] floating enable, resize set 500 180, move position center

# Плавающее окно для системных утилит
for_window [class="mr_float_term"] floating enable, resize set 650 400, move position center
