# Автозапуск системных сервисов
exec_always --no-startup-id picom --backend xrender -b

# Восстановление обоев при старте i3
exec_always --no-startup-id feh --bg-fill $HOME/.config/i3/wallpapers/EV4.png

# Language
exec_always --no-startup-id sh -c "sleep 2 && setxkbmap -layout 'us,ru' -option 'grp:alt_shift_toggle'"

exec_always --no-startup-id ~/.config/polybar/launch.sh

exec_always --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 100%

exec_always --no-startup-id dunst

exec_always --no-startup-id $HOME/.local/bin/mr-bridge q
