# Navigation / Focus
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# Move windows
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# Window states
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle

# Actions
bindsym $mod+q kill
bindsym $mod+Return exec alacritty

# System i3 controls
bindsym $mod+Shift+r reload
bindsym $mod+Shift+c restart
bindsym $mod+Shift+e exit

# Перемещение окон с помощью win + лкм
floating_modifier $mod

bindsym $mod+button3 floating_toggle

# Rofi Launcher
bindsym $mod+d exec --no-startup-id rofi -show drun -theme ~/.config/rofi/themes/mrrobot.rasi

# Rofi Command Launcher
bindsym $mod+Shift+d exec --no-startup-id rofi -show run

# Rofi Window Switcher
bindsym $mod+Tab exec --no-startup-id rofi -show window

# Screenshots
bindsym $mod+Shift+S exec --no-startup-id ~/.local/bin/mr-shot area

# Quick Audio Mixer
bindsym $mod+m exec --no-startup-id $HOME/.local/bin/mr-mixer

# Rofi System Menu
bindsym $mod+p exec --no-startup-id $HOME/.local/bin/mr-menu

# Lockscreen (используем Shift+X чтобы не конфликтовать с $mod+l focus right)
bindsym $mod+Shift+x exec --no-startup-id $HOME/.local/bin/mr-lock

# System Dashboard
bindsym $mod+i exec --no-startup-id $HOME/.local/bin/mr-sysinfo

# Quick Notes
bindsym $mod+b exec --no-startup-id $HOME/.local/bin/mr-notes

bindsym $mod+c exec --no-startup-id $HOME/.local/bin/mr-clip

# Pinger ($mod+Shift+1)
bindsym $mod+Shift+q exec --no-startup-id $HOME/.local/bin/mr-pinger

# Portcheck ($mod+Shift+2)
bindsym $mod+Shift+w exec --no-startup-id $HOME/.local/bin/mr-portcheck

# Dirbuster ($mod+Shift+3)
bindsym $mod+Shift+a exec --no-startup-id $HOME/.local/bin/mr-dirbuster

bindsym $mod+w exec --no-startup-id $HOME/.local/bin/mr-wallpaper

bindsym $mod+Shift+n exec --no-startup-id $HOME/.local/bin/mr-net

bindsym $mod+g exec --no-startup-id $HOME/.local/bin/mr-project
