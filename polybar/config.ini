
[colors]
bg = #080808
bg-alt = #121212
fg = #D6D6D6
fg-muted = #666666
accent = #B00000
accent-bright = #E00000
border = #222222

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 0

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2pt

border-size = 0pt
border-color = ${colors.border}

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = "JetBrains Mono:size=9:weight=bold;2"
font-1 = "Font Awesome 6 Free:size=9;2"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = cpu memory network battery pulseaudio

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

# --- МОДУЛИ ---

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.bg-alt}
label-active-underline= ${colors.accent-bright}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${colors.fg}

label-urgent = %name%
label-urgent-background = ${colors.accent}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.fg-muted}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.fg-muted}

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage:2%%
label-foreground = ${colors.fg}
label-warn-foreground = ${colors.accent-bright}

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used:2%%
label-foreground = ${colors.fg}

[module/network]
type = internal/network
interface = wlp2s0
interval = 3.0
label-connected = NET: UP
label-connected-foreground = ${colors.fg}
label-disconnected = NET: DOWN
label-disconnected-foreground = ${colors.accent}

[module/pulseaudio]
type = internal/pulseaudio
label-volume = VOL %percentage%%
label-volume-foreground = ${colors.fg}
label-muted = VOL MUTE
label-muted-foreground = ${colors.fg-muted}

[module/date]
type = internal/date
interval = 1.0
date = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.accent-bright}

[module/battery]
type = internal/battery
full-at = 98
low-at = 15

; Укажи имя батареи и сетевого адаптера из Step 1
battery = BAT0
adapter = AC

poll-interval = 5

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-charging = BAT %percentage%% [CHG]
label-charging-foreground = ${colors.fg}

label-discharging = BAT %percentage%%
label-discharging-foreground = ${colors.fg}

label-full = BAT FULL
label-full-foreground = ${colors.fg}

label-low = BAT %percentage%% [LOW]
label-low-foreground = ${colors.accent-bright}
